name: Validate Skills

on:
  push:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "commands/**"
      - "skills/**"
      - "scripts/**"
      - "plugins/pstack/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "commands/**"
      - "skills/**"
      - "scripts/**"
      - "plugins/pstack/**"
      - ".github/workflows/validate-skills.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate skills
        run: ./scripts/validate-skills.sh

      - name: Check pstack invocation rule
        run: ./plugins/pstack/scripts/normalize-invocation.sh --check

      - name: Sync smoke test
        run: ./scripts/test-sync.sh
